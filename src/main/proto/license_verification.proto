syntax = "proto3";

package careround.user;

option java_package = "com.dayo.careround.userservice.grpc";
option java_multiple_files = true;

service LicenseVerificationService {
  rpc LicenseNumberExists (LicenseCheckRequest) returns (LicenseCheckResponse);
}

message LicenseCheckRequest {
  string license_number = 1;
}

message LicenseCheckResponse {
  bool exists = 1;
}